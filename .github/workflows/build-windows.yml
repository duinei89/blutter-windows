name: Build Blutter Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # Build Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ==========================================================
      # .NET
      # ==========================================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ==========================================================
      # MSVC
      # ==========================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ==========================================================
      # Environment information
      # ==========================================================

      - name: Show build environment
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host "BLUTTER WINDOWS BUILD ENVIRONMENT"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host ".NET:"
          dotnet --version

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Ninja:"
          ninja --version

          Write-Host ""
          Write-Host "MSVC:"
          cl


      # ==========================================================
      # Python dependencies
      # ==========================================================

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          python -m pip install `
            requests `
            pyelftools


      # ==========================================================
      # Download ICU
      # ==========================================================

      - name: Download ICU
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $url = "https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-Win64-MSVC2019.zip"

          $dir = "$env:GITHUB_WORKSPACE\external"

          $zip = "$dir\icu-windows.zip"

          $out = "$dir\icu-windows"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dir | Out-Null

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "DOWNLOADING ICU"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host $url
          Write-Host ""

          $maxRetries = 5
          $retryInterval = 5
          $success = $false

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {

            try {

              Write-Host "Attempt $attempt of $maxRetries..."

              if (Test-Path $zip) {
                Remove-Item $zip -Force
              }

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $zip `
                -UseBasicParsing

              if (Test-Path $zip) {

                $size = (Get-Item $zip).Length

                if ($size -gt 10000) {
                  $success = $true
                  break
                }

              }

              throw "Downloaded ICU archive is invalid."

            }
            catch {

              Write-Warning $_

              if ($attempt -lt $maxRetries) {

                Write-Host ""
                Write-Host "Retrying in $retryInterval seconds..."
                Start-Sleep -Seconds $retryInterval

              }
            }
          }

          if (-not $success) {
            throw "ICU download failed after $maxRetries attempts."
          }

          Write-Host ""
          Write-Host "ICU download successful."

          Write-Host "Archive size:"
          (Get-Item $zip).Length

          Write-Host ""
          Write-Host "Extracting ICU..."

          if (Test-Path $out) {
            Remove-Item `
              $out `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $out `
            -Force

          Remove-Item `
            $zip `
            -Force

          Write-Host ""
          Write-Host "ICU ready."


      # ==========================================================
      # Download Capstone
      # ==========================================================

      - name: Download Capstone
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $url = "https://github.com/capstone-engine/capstone/releases/download/4.0.2/capstone-4.0.2-win64.zip"

          $dir = "$env:GITHUB_WORKSPACE\external"

          $zip = "$dir\capstone.zip"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dir | Out-Null

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "DOWNLOADING CAPSTONE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host $url
          Write-Host ""

          $maxRetries = 5
          $retryInterval = 5
          $success = $false

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {

            try {

              Write-Host "Attempt $attempt of $maxRetries..."

              if (Test-Path $zip) {
                Remove-Item $zip -Force
              }

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $zip `
                -UseBasicParsing

              if (Test-Path $zip) {

                $size = (Get-Item $zip).Length

                if ($size -gt 10000) {
                  $success = $true
                  break
                }

              }

              throw "Downloaded Capstone archive is invalid."

            }
            catch {

              Write-Warning $_

              if ($attempt -lt $maxRetries) {

                Write-Host ""
                Write-Host "Retrying in $retryInterval seconds..."
                Start-Sleep -Seconds $retryInterval

              }
            }
          }

          if (-not $success) {
            throw "Capstone download failed after $maxRetries attempts."
          }

          Write-Host ""
          Write-Host "Capstone download successful."

          Write-Host "Archive size:"
          (Get-Item $zip).Length

          Write-Host ""
          Write-Host "Extracting Capstone..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Remove-Item `
            $zip `
            -Force

          Write-Host ""
          Write-Host "Capstone ready."


      # ==========================================================
      # Inspect downloaded files
      # ==========================================================

      - name: Inspect dependencies
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "DOWNLOADED DEPENDENCIES"
          Write-Host "=============================================="
          Write-Host ""

          Get-ChildItem `
            "$env:GITHUB_WORKSPACE\external" `
            -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize


      # ==========================================================
      # Initialize Blutter
      # ==========================================================

      - name: Initialize Blutter environment
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BLUTTER INITIALIZATION"
          Write-Host "=============================================="
          Write-Host ""

          python scripts\init_env_win.py


      # ==========================================================
      # Build Windows package
      # ==========================================================

      - name: Build Windows package
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "BUILDING WINDOWS PACKAGE"
          Write-Host "=============================================="
          Write-Host ""

          .\build-windows.ps1


      # ==========================================================
      # Test executable
      # ==========================================================

      - name: Test CLI
        shell: powershell
        run: |

          $exe = ".\dist\blutter\blutter.exe"

          if (!(Test-Path $exe)) {
            throw "blutter.exe was not generated."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "CLI TEST"
          Write-Host "=============================================="
          Write-Host ""

          & $exe --version

          if ($LASTEXITCODE -ne 0) {
            throw "Version test failed."
          }

          Write-Host ""

          & $exe --help

          if ($LASTEXITCODE -ne 0) {
            throw "Help test failed."
          }


      # ==========================================================
      # Package ZIP
      # ==========================================================

      - name: Create Windows ZIP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $zip = ".\dist\blutter-windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path ".\dist\blutter\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "PACKAGE CREATED"
          Write-Host "=============================================="
          Write-Host ""

          Get-Item $zip


      # ==========================================================
      # GitHub Artifact
      # ==========================================================

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-windows-x64
          path: dist/blutter-windows-x64.zip


      # ==========================================================
      # GitHub Release
      # ==========================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/blutter-windows-x64.zip
