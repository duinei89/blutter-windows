name: Build Blutter Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:

    runs-on: windows-2025

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show environment
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "WINDOWS BUILD ENVIRONMENT"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Compiler:"
          cl

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Ninja:"
          ninja --version

          Write-Host ""
          Write-Host "Python:"
          python --version


      - name: Build Blutter Windows
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          .\build-windows.ps1

          if ($LASTEXITCODE -ne 0) {
              throw "Windows build failed."
          }


      - name: Verify package
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $Package = ".\dist\blutter"

          if (!(Test-Path "$Package\blutter.exe")) {
              throw "blutter.exe missing."
          }

          if (!(Test-Path "$Package\python\python.exe")) {
              throw "Bundled Python missing."
          }

          if (!(Test-Path "$Package\blutter.py")) {
              throw "blutter.py missing."
          }

          Write-Host ""
          Write-Host "Package verification passed."
          Write-Host ""

          Get-Item "$Package\blutter.exe"


      - name: Create ZIP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $Zip = ".\blutter-windows-x64.zip"

          if (Test-Path $Zip) {
              Remove-Item $Zip -Force
          }

          Compress-Archive `
            -Path ".\dist\blutter\*" `
            -DestinationPath $Zip `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "Created:"
          Write-Host $Zip
          Write-Host ""

          Get-Item $Zip


      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-windows-x64
          path: blutter-windows-x64.zip


      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: blutter-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
