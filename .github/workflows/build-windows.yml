name: Build Blutter Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:

    runs-on: windows-2025

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # MSVC
      # ======================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ======================================================
      # VERIFY BUILD ENVIRONMENT
      # ======================================================

      - name: Verify build environment
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "================ MSVC ================"

          where.exe cl.exe

          Write-Host ""
          cl.exe 2>&1 | Select-Object -First 5

          Write-Host ""
          Write-Host "================ CMAKE ================"

          cmake --version

          Write-Host ""
          Write-Host "================ NINJA ================"

          ninja --version


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Blutter Windows
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          .\build-windows.ps1


      # ======================================================
      # VERIFY EXE
      # ======================================================

      - name: Verify executable
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $exe = ".\dist\blutter\blutter.exe"

          if (!(Test-Path $exe)) {
              throw "blutter.exe was not generated."
          }

          Write-Host ""
          Write-Host "blutter.exe:"
          Get-Item $exe

          Write-Host ""
          Write-Host "File type:"
          (Get-Item $exe).VersionInfo


      # ======================================================
      # CREATE ZIP
      # ======================================================

      - name: Create Windows ZIP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $zip = ".\blutter-windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path ".\dist\blutter\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "ZIP:"
          Get-Item $zip


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-windows-x64
          path: blutter-windows-x64.zip


      # ======================================================
      # RELEASE
      # ======================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: blutter-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
