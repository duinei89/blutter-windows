name: Build Blutter Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:

    runs-on: windows-2025

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # MSVC
      # ======================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ======================================================
      # VERIFY MSVC
      # ======================================================

      - name: Verify MSVC
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========== MSVC =========="

          where.exe cl.exe

          Write-Host ""

          cl.exe 2>&1


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Blutter Windows
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          .\build-windows.ps1


      # ======================================================
      # VERIFY
      # ======================================================

      - name: Verify build
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $exe = ".\dist\blutter\blutter.exe"

          if (!(Test-Path $exe)) {
              throw "blutter.exe was not created."
          }

          Write-Host ""
          Write-Host "Executable successfully created:"
          Get-Item $exe


      # ======================================================
      # PACKAGE
      # ======================================================

      - name: Create ZIP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $zip = ".\blutter-windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path ".\dist\blutter\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host ""
          Write-Host "Package:"
          Get-Item $zip


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-windows-x64
          path: blutter-windows-x64.zip


      # ======================================================
      # RELEASE
      # ======================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: blutter-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
