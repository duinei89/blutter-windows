name: Build Blutter Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:

    runs-on: windows-2025

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # MSVC
      # ======================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ======================================================
      # VERIFY MSVC
      # ======================================================

      - name: Verify MSVC
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    MSVC ENVIRONMENT"
          Write-Host "============================================================"
          Write-Host ""

          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue

          if (!$cl) {
              throw "cl.exe was not found."
          }

          Write-Host "cl.exe:"
          Write-Host $cl.Source
          Write-Host ""

          Write-Host "Visual Studio environment is ready."
          Write-Host ""


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Blutter Windows
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  BUILDING BLUTTER"
          Write-Host "============================================================"
          Write-Host ""

          .\build-windows.ps1

          if ($LASTEXITCODE -ne 0) {
              throw "build-windows.ps1 failed with exit code $LASTEXITCODE."
          }


      # ======================================================
      # VERIFY EXECUTABLE
      # ======================================================

      - name: Verify executable
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  VERIFYING EXECUTABLE"
          Write-Host "============================================================"
          Write-Host ""

          $exe = ".\dist\blutter\blutter.exe"

          if (!(Test-Path $exe)) {
              throw "blutter.exe was not created."
          }

          $file = Get-Item $exe

          Write-Host "Path:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"

          Write-Host ""
          Write-Host "Executable exists."


      # ======================================================
      # VERIFY BUNDLED PYTHON
      # ======================================================

      - name: Verify bundled Python
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $python = ".\dist\blutter\python\python.exe"

          if (!(Test-Path $python)) {
              throw "Bundled Python was not created."
          }

          Write-Host ""
          Write-Host "Bundled Python:"
          Write-Host $python
          Write-Host ""

          & $python --version

          if ($LASTEXITCODE -ne 0) {
              throw "Bundled Python failed."
          }


      # ======================================================
      # SHOW PACKAGE
      # ======================================================

      - name: Inspect package
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    PACKAGE CONTENTS"
          Write-Host "============================================================"
          Write-Host ""

          Get-ChildItem `
            ".\dist\blutter" `
            -Recurse `
            -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize


      # ======================================================
      # CREATE ZIP
      # ======================================================

      - name: Create Windows ZIP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $zip = ".\blutter-windows-x64.zip"

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path ".\dist\blutter\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
              throw "ZIP was not created."
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    PACKAGE CREATED"
          Write-Host "============================================================"
          Write-Host ""

          Get-Item $zip


      # ======================================================
      # UPLOAD ARTIFACT
      # ======================================================

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-windows-x64
          path: blutter-windows-x64.zip
          if-no-files-found: error


      # ======================================================
      # GITHUB RELEASE
      # ======================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: blutter-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
