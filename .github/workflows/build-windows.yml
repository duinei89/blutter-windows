name: Build Blutter Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-windows:

    runs-on: windows-2025

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ======================================================
      # MSVC ENVIRONMENT
      # ======================================================

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64


      # ======================================================
      # VERIFY MSVC
      # ======================================================

      - name: Verify MSVC
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " MSVC"
          Write-Host "============================================================"
          Write-Host ""

          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue

          if (!$cl) {
            throw "cl.exe was not found."
          }

          Write-Host "cl.exe:"
          Write-Host $cl.Source
          Write-Host ""

          Write-Host "MSVC version:"

          & cl.exe /Bv

          if ($LASTEXITCODE -ne 0) {
            throw "MSVC compiler verification failed."
          }

          Write-Host ""
          Write-Host "MSVC environment is ready."


      # ======================================================
      # VERIFY BUILD TOOLS
      # ======================================================

      - name: Verify Build Tools
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " BUILD TOOLS"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Ninja:"
          ninja --version

          Write-Host ""
          Write-Host "Rust:"
          rustc --version

          Write-Host ""
          Write-Host "Cargo:"
          cargo --version


      # ======================================================
      # BUILD
      # ======================================================

      - name: Build Blutter Windows
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " BUILDING BLUTTER WINDOWS"
          Write-Host "============================================================"
          Write-Host ""

          & .\build-windows.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "build-windows.ps1 failed with exit code $LASTEXITCODE."
          }


      # ======================================================
      # VERIFY EXECUTABLE
      # ======================================================

      - name: Verify Executable
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $Package =
            ".\dist\blutter"

          $Exe =
            "$Package\blutter.exe"

          if (!(Test-Path $Exe)) {
            throw "blutter.exe was not generated."
          }

          Write-Host ""
          Write-Host "Executable:"
          Write-Host (Resolve-Path $Exe)

          Write-Host ""
          Write-Host "Size:"
          Write-Host ((Get-Item $Exe).Length)


      # ======================================================
      # VERIFY PYTHON
      # ======================================================

      - name: Verify Bundled Python
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $Python =
            ".\dist\blutter\python\python.exe"

          if (!(Test-Path $Python)) {
            throw "Bundled Python is missing."
          }

          & $Python --version

          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Python failed."
          }


      # ======================================================
      # VERIFY LLVM-MINGW
      # ======================================================

      - name: Verify Bundled Compiler
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $Clang =
            ".\dist\blutter\tools\llvm-mingw\bin\clang.exe"

          $ClangXX =
            ".\dist\blutter\tools\llvm-mingw\bin\clang++.exe"

          if (!(Test-Path $Clang)) {
            throw "Bundled clang.exe is missing."
          }

          if (!(Test-Path $ClangXX)) {
            throw "Bundled clang++.exe is missing."
          }

          Write-Host ""
          Write-Host "Bundled clang:"
          Write-Host $Clang

          & $Clang --version

          if ($LASTEXITCODE -ne 0) {
            throw "Bundled clang failed."
          }

          Write-Host ""
          Write-Host "Bundled clang++:"
          Write-Host $ClangXX

          & $ClangXX --version

          if ($LASTEXITCODE -ne 0) {
            throw "Bundled clang++ failed."
          }


      # ======================================================
      # TEST CLI
      # ======================================================

      - name: Test CLI
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $Exe =
            ".\dist\blutter\blutter.exe"

          if (!(Test-Path $Exe)) {
            throw "blutter.exe is missing."
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " CLI TEST"
          Write-Host "============================================================"
          Write-Host ""

          & $Exe

          # No arguments intentionally returns non-zero.
          # We only verify that the executable starts and prints
          # its CLI instead of failing because of .NET.


      # ======================================================
      # PACKAGE
      # ======================================================

      - name: Create ZIP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $Zip =
            ".\dist\blutter-windows-x64.zip"

          if (Test-Path $Zip) {
            Remove-Item $Zip -Force
          }

          Compress-Archive `
            -Path ".\dist\blutter\*" `
            -DestinationPath $Zip `
            -CompressionLevel Optimal

          if (!(Test-Path $Zip)) {
            throw "ZIP package was not created."
          }

          Write-Host ""
          Write-Host "Package:"
          Write-Host (Resolve-Path $Zip)

          Write-Host ""
          Write-Host "Size:"
          Write-Host ((Get-Item $Zip).Length)


      # ======================================================
      # ARTIFACT
      # ======================================================

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutter-windows-x64
          path: dist/blutter-windows-x64.zip


      # ======================================================
      # RELEASE
      # ======================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/blutter-windows-x64.zip
          generate_release_notes: true
